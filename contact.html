<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="logo" href="index.html">IdIvry</a>
    <nav aria-label="Navigation principale">

        <li><a href="contact.html" aria-current="page">Contact</a></li>
      </ul>
    </nav>
  </div>
</header>
<main class="page">
  <div class="wrap">
    <h1>Contact</h1>
    <p class="sub">Votre message s’ouvre dans votre application de messagerie.</p>
    <form class="contact" id="contactForm">
      <div><label for="name">Nom</label><input type="text" id="name" required></div>
      <div><label for="msgtxt">Message</label><textarea id="msgtxt" required></textarea></div>
      <div><button class="btn" type="submit" style="margin-top:0">Envoyer le message</button></div>
    </form>
  </div>
</main>
<footer>
  <div class="wrap">
    <span>© <span id="yr"></span> IdIvry</span>
    <ul>
      <li><a href="privacy.html">Confidentialité</a></li>
      <li><a href="terms.html">Conditions d’utilisation</a></li>
      <li><a href="#">TikTok</a></li>
      <li><a href="#">Instagram</a></li>
      <li><a href="#">Snapchat</a></li>
      <li><a href="#">Facebook</a></li>
    </ul>
  </div>
</footer>
<script>
document.getElementById("yr").textContent = new Date().getFullYear();
document.getElementById("contactForm").addEventListener("submit", e => {
  e.preventDefault();
  const subject = encodeURIComponent("Message de " + document.getElementById("name").value);
  const body = encodeURIComponent(document.getElementById("msgtxt").value);
  location.href = `mailto:chmoud82@gmail.com?subject=${subject}&body=${body}`;
});
</script>
</body>
